# This is a basic workflow to help you get started with Actions

name: Validate repo structure

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::Missing /docs folder"
            exit 1
          fi
          echo "/docs folder found"

      - name: Check ERD file exists
        run: |
          if [ ! -f "docs/erdprog.drawio (1).png" ]; then
            echo "::error::Missing docs/erdprog.drawio (1).png file"
            exit 1
          fi
          echo "erdprog.drawio (1).png found"

      - name: Check API endpoint plan exists
        run: |
          if [ ! -f "docs/APIEndpointPlan.md" ]; then
            echo "::error::Missing docs/APIEndpointPlan.md file"
            exit 1
          fi
          echo "APIEndpointPlan.md found"

      - name: Check SQL script exists
        run: |
          if [ ! -f "docs/RacedayDatabase.sql" ]; then
            echo "::error::Missing docs/RacedayDatabase.sql file"
            exit 1
          fi
          echo "RacedayDatabase.sql found"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::Missing README.md at repository root"
            exit 1
          fi
          echo "README.md found"
 
      - name: Structure validation passed
        run: echo "All required Part 1 deliverables are present."
